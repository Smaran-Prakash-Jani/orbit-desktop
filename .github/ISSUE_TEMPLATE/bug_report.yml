name: Bug report
description: Report a reproducible problem with Orbit
body:
  - type: input
    id: environment
    attributes:
      label: OS, package format, and Orbit version
      placeholder: Deepin 25 / deb / 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Include what you saw instead. Avoid usernames, local paths, IP addresses, and other private details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Review any report or screenshot for private information before attaching it.
